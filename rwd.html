<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*MOBILE FIRST*/
        /*SIN NINGUN MEDIA QUERY PARA DISPOSITIVOS MÓVILES */
        div{
            background: red;
            height: 100px;
        }
        /*TABLETS */
        @media screen and (min-width:768px) {

            div{
                background: green;
                height: 200px;
            }
        }
        /* desktop */
        @media screen and (min-width:1200px){
            div{
                background:blue;
                height: 100dvh;
            }
        }
        /* grandes formatos*/
        @media screen and (min-width:2400px){
             div{
                background:purple;
                height: 100dvh;
            }
        }









        @media print {
            body{
                width:23cm;
                height: 30cm;
            }
            div{
                width:100%;
                height:3cm;
                background-color: #ccc;
            }

        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
